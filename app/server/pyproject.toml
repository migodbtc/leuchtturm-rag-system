[project]
name = "yellowpad-api"
version = "0.1.0"
description = ""
authors = [
    { name = "migodbtc", email = "mjdmbunda@dbtcmandaluyong.one-bosco.org" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "cryptography (>=48.0.0,<49.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.28,<0.0.29)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt (<4.0)",
    "requests (>=2.34.1,<3.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (==0.24.0)",
    "load-dotenv (>=0.1.0,<0.2.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
